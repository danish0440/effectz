[package]
name = "effectz-expr"
description = "After Effects-compatible expressions: a boa JavaScript runtime with the AE object model (thisComp, thisLayer, wiggle, loopOut, valueAtTime…) and array maths"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
effectz-time = { workspace = true }
effectz-geom = { workspace = true }
effectz-keyframe = { workspace = true }
serde_json = { workspace = true }
effectz-project = { workspace = true }
effectz-path = { workspace = true }
effectz-render = { workspace = true }
boa_engine = { workspace = true }

# On the web, boa's clock and Math.random need the browser (getrandom `wasm_js`, web-time).
[target.'cfg(target_arch = "wasm32")'.dependencies]
boa_engine = { workspace = true, features = ["js"] }

[dev-dependencies]
effectz-color = { workspace = true }
effectz-effects = { workspace = true }
effectz-text = { workspace = true }
