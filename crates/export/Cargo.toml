[package]
name = "effectz-export"
description = "Render Queue jobs and output modules: H.264 MP4 (+AAC), ProRes and uncompressed MOV (+PCM) via FilmZ, HEVC / AV1 MP4 (+AAC) and WebM (VP9 or AV1 + Opus) via EffectZ encoders, PNG/JPEG/TIFF/EXR/Targa sequences, animated GIF, WAV/AIFF"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
effectz-time = { workspace = true }
effectz-project = { workspace = true }
effectz-raster = { workspace = true }
effectz-render = { workspace = true }
filmcraft-h264enc = { workspace = true }
filmcraft-prores = { workspace = true }
filmcraft-aac = { workspace = true }
filmcraft-isobmff = { workspace = true }
effectz-opusenc = { workspace = true }
effectz-vp9enc = { workspace = true }
effectz-hevcenc = { workspace = true }
effectz-av1enc = { workspace = true }
image = { workspace = true, features = ["png", "jpeg", "tiff", "exr", "tga"] }
gif = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
thiserror = { workspace = true }
log = { workspace = true }

[dev-dependencies]
effectz-media = { workspace = true }
effectz-effects = { workspace = true }
effectz-color = { workspace = true }
filmcraft-opus = { workspace = true }
filmcraft-vp9 = { workspace = true }
effectz-keyframe = { workspace = true }
