[package]
name = "effectz-render"
description = "The CPU compositor: property evaluation, layer sources (solids, footage, text, shapes, precomps), masks, effects, track mattes, 2D/3D transforms, motion blur and blending"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
effectz-time = { workspace = true }
effectz-geom = { workspace = true }
effectz-color = { workspace = true }
effectz-keyframe = { workspace = true }
effectz-project = { workspace = true }
effectz-raster = { workspace = true }
effectz-path = { workspace = true }
effectz-text = { workspace = true }
effectz-effects = { workspace = true }
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-encode", "safe-decode", "checked-decode"] }
effectz-model = { workspace = true }
kurbo = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
serde = { workspace = true }
log = { workspace = true }
