[package]
name = "effectz-aep"
description = "After Effects projects: the .aep (RIFX 'Egg!') / .aepx container as a lossless chunk tree with a typed view, import into an EffectZ project and export back to .aep with every chunk built in code; each reports everything it does not carry over"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
effectz-time = { workspace = true }
effectz-color = { workspace = true }
effectz-keyframe = { workspace = true }
effectz-project = { workspace = true }
effectz-effects = { workspace = true }
log = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }

# The tool's own tests run with the crate's (examples are only built by default).
[[example]]
name = "stubicc"
test = true
