[package]
name = "effectz-ui-egui"
description = "The EffectZ egui frontend (swappable): docking panels, composition viewer, timeline, effect controls, control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
craft-ui = { workspace = true }
effectz-time = { workspace = true }
effectz-geom = { workspace = true }
effectz-color = { workspace = true }
effectz-keyframe = { workspace = true }
effectz-project = { workspace = true }
effectz-path = { workspace = true }
effectz-text = { workspace = true }
effectz-render = { workspace = true }
effectz-engine = { workspace = true }
effectz-gpu = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
chrono = { workspace = true }
rayon = { workspace = true }
web-time = { workspace = true }
kurbo = { workspace = true }
image = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sys-locale = { workspace = true }

[dev-dependencies]
egui_kittest = { workspace = true, features = ["eframe", "wgpu"] }
pollster = "0.4"
effectz-host = { workspace = true }
exr = { workspace = true }

[build-dependencies]
serde_json = { workspace = true }
toml = "1"
