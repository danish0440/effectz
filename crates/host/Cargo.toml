[package]
name = "effectz-host"
description = "Builds a fully wired EffectZ session: media decoding (FilmZ codecs), importer, the expression engine and scripting"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
effectz-engine = { workspace = true }
effectz-project = { workspace = true }
log = { workspace = true }
effectz-media = { workspace = true }
effectz-expr = { workspace = true }
effectz-script = { workspace = true }
effectz-export = { workspace = true }
effectz-plugin = { workspace = true }

# WebAssembly effect plug-ins run in wasmi on native builds.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
effectz-plugin = { workspace = true, features = ["wasm"] }

[dev-dependencies]
serde_json = { workspace = true }
effectz-psd = { workspace = true }
effectz-svg = { workspace = true }
effectz-pdf = { workspace = true }
effectz-raster = { workspace = true }
effectz-time = { workspace = true }
effectz-interchange = { workspace = true }
image = { workspace = true }
gif = { workspace = true }
exr = { workspace = true }
rayon = { workspace = true }
