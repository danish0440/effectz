# Checks index.json on every pull request and push: schema, unique ids, every release's download
# (size + SHA-256), then installs every package with the real EffectZ loader.
# Lives at .github/workflows/validate.yml in storytold/effectz-plugins.
name: Validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check out EffectZ
        uses: actions/checkout@v4
        with:
          repository: danish0440/effectz
          path: effectz

      # The CLI links the UI crate, which needs these to build (same list as EffectZ's CI).
      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcb1-dev \
            libxcursor-dev libxrandr-dev libxi-dev libfontconfig1-dev libfreetype-dev libgl1-mesa-dev libasound2-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: effectz

      - name: Build effectz-cli
        working-directory: effectz
        run: cargo build -p effectz-cli

      - name: Validate the catalog
        env:
          EFFECTZ_CLI: ${{ github.workspace }}/effectz/target/debug/effectz-cli
        run: bash scripts/validate.sh index.json
